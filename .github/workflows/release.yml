name: Release

# Tag a version to publish installers:
#     git tag v1.1.0 && git push origin v1.1.0
#
# The README's download links point at releases/latest/download/OpenFlowSetup.exe
# and releases/latest/download/OpenFlow-mac.dmg, so whatever this attaches
# becomes what new users get. Nothing is published unless both frozen builds
# pass their smoke tests first -- a release missing one file would leave that
# README link pointing at a 404.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.1.0), no leading v"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^v', '' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "version '$v' is not x.y.z" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "building $v"

  windows:
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t .

      - name: Build
        run: pyinstaller OpenFlow.spec --noconfirm --clean

      - name: Smoke-test the frozen build
        shell: pwsh
        run: ./scripts/smoke_frozen_build.ps1 -ExePath dist/OpenFlow/OpenFlow.exe

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DMyAppVersion=${{ needs.version.outputs.version }} installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist_installer/OpenFlowSetup.exe
          if-no-files-found: error

  macos:
    # Apple Silicon runner, so the app is arm64-only.
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # Unit tests run in the windows job; several pin Windows paths on purpose.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller OpenFlow.spec --noconfirm --clean

      # One certificate for every release, so macOS keeps the user's
      # Accessibility / Input Monitoring / Microphone grants across updates.
      - name: Sign
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: bash scripts/sign_macos.sh dist/OpenFlow.app

      - name: Smoke-test the frozen build
        shell: pwsh
        run: ./scripts/smoke_frozen_build.ps1 -ExePath dist/OpenFlow.app/Contents/MacOS/OpenFlow

      - name: Build disk image
        run: bash scripts/build_dmg.sh dist/OpenFlow.app dist_installer/OpenFlow-mac.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist_installer/OpenFlow-mac.dmg
          if-no-files-found: error

  # Neither installer carries a trusted signature -- a Windows code signing
  # certificate and an Apple Developer ID are paid, identity-verified
  # purchases, and this project isn't buying either. The Mac app is signed
  # with the project's own certificate (scripts/sign_macos.sh), which keeps
  # permissions across updates but does not satisfy Gatekeeper. SmartScreen
  # and Gatekeeper both warn on first launch; the README says how to get past
  # each.
  publish:
    runs-on: ubuntu-latest
    needs: [version, windows, macos]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: OpenFlow ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            installers/OpenFlowSetup.exe
            installers/OpenFlow-mac.dmg
