name: Release

# Tag a version to publish an installer:
#     git tag v1.1.0 && git push origin v1.1.0
#
# The README's download link points at releases/latest/download/OpenFlowSetup.exe,
# so whatever this attaches becomes what new users get. Nothing is published
# unless the frozen build passes its smoke test first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.1.0), no leading v"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^v', '' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "version '$v' is not x.y.z" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "building $v"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t .

      - name: Build
        run: pyinstaller OpenFlow.spec --noconfirm --clean

      - name: Smoke-test the frozen build
        shell: pwsh
        run: ./scripts/smoke_frozen_build.ps1 -ExePath dist/OpenFlow/OpenFlow.exe

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      # Signing is skipped unless the secrets exist. An unsigned installer trips
      # SmartScreen's "unrecognized app" wall, which is a real adoption tax for
      # a tool that asks for the microphone and a global keyboard hook -- but a
      # certificate has to be bought and is tied to an identity, so it cannot be
      # set up from here. Add CODE_SIGN_PFX (base64 of the .pfx) and
      # CODE_SIGN_PASSWORD as repository secrets to turn this on.
      - name: Sign installer
        if: ${{ env.CODE_SIGN_PFX != '' }}
        env:
          CODE_SIGN_PFX: ${{ secrets.CODE_SIGN_PFX }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse `
            -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } |
            Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $pfx /p $env:CODE_SIGN_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 dist_installer/OpenFlowSetup.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          Remove-Item $pfx -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OpenFlow ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist_installer/OpenFlowSetup.exe
